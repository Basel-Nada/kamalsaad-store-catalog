name: Auto Sync Kamal Saad Products

on:
  schedule:
    # Runs every day at 06:00 UTC (9:00 AM Cairo Time)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Scraper
        run: |
          python scripts/scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json products.js
          if git diff --staged --quiet; then
            echo "No changes detected in products data."
          else
            git commit -m "chore(data): auto-sync products from kamalsaad.com [skip ci]"
            git push
            echo "Changes pushed successfully! Vercel will auto-deploy."
          fi
